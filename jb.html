<!DOCTYPE html>
<html lang="es" manifest="cache.appcache">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HOST:PERRUNOGT</title>

  <style>
    :root {
      --bg: #020504;
      --panel: #040e09;
      --green: #00ff88;
      --green3: #65ffb3;
      --text: #eafff3;
      --muted: #537565;
      --red: #ff365e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
    }

    body {
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: monospace, sans-serif;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(
          rgba(0, 255, 136, 0.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 255, 136, 0.018) 1px,
          transparent 1px
        );
      background-size: 40px 40px;
      pointer-events: none;
    }

    #main-container {
      position: relative;
      width: min(88vw, 440px);
      height: min(88vw, 440px);
      min-width: 290px;
      min-height: 290px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--panel);
      border: 1px solid rgba(0, 255, 136, 0.22);
      border-radius: 30px;
      box-shadow:
        0 10px 35px rgba(0, 0, 0, 0.72),
        0 0 18px rgba(0, 255, 136, 0.07);
    }

    #main-container::before,
    #main-container::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: var(--green);
      opacity: 0.7;
    }

    #main-container::before {
      top: -1px;
      left: -1px;
      border-top: 2px solid;
      border-left: 2px solid;
      border-radius: 30px 0 0 0;
    }

    #main-container::after {
      right: -1px;
      bottom: -1px;
      border-right: 2px solid;
      border-bottom: 2px solid;
      border-radius: 0 0 30px 0;
    }

    #brand {
      position: absolute;
      top: 38px;
      font-family: monospace, sans-serif;
      font-size: clamp(17px, 5vw, 23px);
      font-weight: 800;
      letter-spacing: 0.13em;
      color: #fff;
      text-shadow: 0 0 8px rgba(0, 255, 136, 0.55);
    }

    #brand::before {
      content: "GOLDHEN HOST";
      display: block;
      margin-bottom: 6px;
      text-align: center;
      font-size: 8px;
      font-weight: 400;
      letter-spacing: 0.35em;
      color: var(--muted);
    }

    #visual-indicator {
      position: relative;
      width: 190px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 38px;
    }

    .core {
      position: relative;
      width: 58px;
      height: 58px;
      border-radius: 14px;
      transform: rotate(45deg);
      background: var(--green);
      box-shadow: 0 0 14px var(--green);
      z-index: 5;
    }

    .core::before {
      content: "";
      position: absolute;
      width: 22px;
      height: 22px;
      top: 18px;
      left: 18px;
      background: #fff;
      border-radius: 5px;
    }

    #visual-indicator::before,
    #visual-indicator::after {
      content: "";
      position: absolute;
      width: 110px;
      height: 110px;
      border: 1px solid rgba(0, 255, 136, 0.18);
      transform: rotate(45deg);
    }

    #visual-indicator::after {
      width: 150px;
      height: 150px;
      border-color: rgba(0, 255, 136, 0.07);
    }

    #spin {
      position: absolute;
      width: 180px;
      height: 70px;
      z-index: 2;
    }

    #spin::before,
    #spin::after {
      content: "";
      position: absolute;
      left: 50%;
      width: 140px;
      height: 2px;
      transform: translateX(-50%);
      background:
        linear-gradient(
          90deg,
          transparent,
          var(--green),
          transparent
        );
    }

    #spin::before {
      top: 8px;
    }

    #spin::after {
      bottom: 8px;
    }

    .pulse {
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 18px;
      border: 1px dashed rgba(0, 255, 136, 0.16);
      transform: rotate(45deg);
    }

    body.done #main-container {
      border-color: rgba(0, 255, 136, 0.55);
      box-shadow: 0 0 28px rgba(0, 255, 136, 0.18);
    }

    body.done #brand {
      color: var(--green3);
    }

    body.done #spin {
      display: none;
    }

    body.done .pulse {
      border-color: rgba(0, 255, 136, 0.55);
    }

    body.done .core {
      background: var(--green);
      box-shadow: 0 0 20px var(--green);
    }

    body.fail #main-container {
      border-color: rgba(255, 54, 94, 0.45);
      box-shadow: 0 0 28px rgba(255, 54, 94, 0.16);
    }

    body.fail #brand {
      color: var(--red);
    }

    body.fail #spin {
      display: none;
    }

    body.fail .pulse {
      border-color: var(--red);
    }

    body.fail .core {
      background: var(--red);
      box-shadow: 0 0 16px var(--red);
    }

    #msg {
      position: fixed;
      left: 50%;
      bottom: 78px;
      transform: translateX(-50%);
      display: none;
      width: 90%;
      text-align: center;
      font-family: monospace, sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      color: var(--red);
    }

    body.fail #msg {
      display: block;
    }

    #footer {
      position: fixed;
      bottom: 25px;
      font-family: monospace, sans-serif;
      font-size: 9px;
      letter-spacing: 0.22em;
      color: rgba(140, 210, 170, 0.4);
    }

    #footer::before {
      content: "◆ ";
      color: var(--green);
    }

    #exploit-title {
      position: fixed;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      padding: 10px 22px;
      color: var(--green);
      border: 1px solid rgba(0, 255, 136, 0.45);
      border-radius: 10px;
      background: rgba(2, 12, 7, 0.96);
      font-family: monospace, sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.10em;
      text-align: center;
      white-space: nowrap;
    }

    #credits {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      z-index: 10;
      width: min(92vw, 700px);
      color: var(--green);
      font-family: monospace, sans-serif;
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.05em;
      text-align: center;
    }

    #wrap {
      padding: 0;
    }

    #state,
    #out {
      display: none;
    }

    body.log {
      display: block;
      overflow: auto;
      padding: 20px;
      background: var(--bg);
    }

    body.log::before,
    body.log::after,
    body.log #main-container,
    body.log #footer,
    body.log #exploit-title,
    body.log #credits {
      display: none;
    }

    body.log #wrap {
      display: block;
      max-width: 900px;
      margin: 0 auto;
    }

    body.log #state {
      display: block;
      margin-bottom: 12px;
      font-family: monospace, sans-serif;
      font-size: 18px;
      font-weight: 700;
      color: var(--text);
    }

    body.log #out {
      display: block;
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 16px;
      white-space: pre-wrap;
      font: 12px/1.6 monospace, sans-serif;
      color: var(--text);
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(0, 255, 136, 0.12);
      border-radius: 12px;
    }

    .ok,
    .safe {
      color: var(--green);
    }

    .bad,
    .danger {
      color: var(--red);
    }

    .warn {
      color: #e3b341;
    }

    code {
      color: #72c99c;
      font-family: monospace, sans-serif;
    }

    @media (max-width: 600px) {
      #exploit-title {
        top: 12px;
        padding: 8px 12px;
        font-size: 8px;
      }

      #credits {
        bottom: 42px;
        font-size: 8px;
        padding: 0 12px;
      }

      #main-container {
        width: 88vw;
        height: 88vw;
      }
    }
  </style>
</head>
<body>

  <div id="exploit-title">
    CARGA DE EXPLOIT GOLDHEN 11.00 A 13.52
  </div>

  <div id="main-container">
    <div id="brand">HOST:PERRUNOGT</div>

    <div id="visual-indicator">
      <div id="spin"></div>
      <div class="pulse"></div>
      <div class="core"></div>
    </div>
  </div>

  <div id="msg">Restart your console</div>

  <div id="credits">
    Agradecimientos a Raw game y sistro por la distribución del exploit y carga de GoldHEN
  </div>

  <div id="wrap">
    <div id="state"></div>
    <div id="out"></div>
  </div>

  <div id="footer">
    PERRUNOGT // GOLDHEN HOST
  </div>

  <script type="module">
    import "./jb.js?v=10";
  </script>

</body>
</html>
